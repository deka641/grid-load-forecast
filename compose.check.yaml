# Isolated production-like instance for `make prod-check` and `make loadtest`.
# Used as: docker compose -p grid-load-forecast-check -f compose.yaml -f compose.check.yaml
# Own image tags, so building the check stack never changes the images of the live stack.
services:
  pipeline:
    image: grid-load-forecast-python:check
    restart: "no"
    # Serve the copied data without contacting SMARD: only the healthcheck runs.
    command: ["sleep", "infinity"]
    cpus: 0.5
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
  api:
    image: grid-load-forecast-python:check
    restart: "no"
    environment:
      FORWARDED_ALLOW_IPS: 10.46.60.10
    networks:
      backend:
        ipv4_address: 10.46.60.11
    healthcheck:
      interval: 5s
  web:
    image: grid-load-forecast-web:check
    restart: "no"
    ports: !override
      - "127.0.0.1:8461:8080"
    networks:
      backend:
        ipv4_address: 10.46.60.10
    healthcheck:
      interval: 5s

# A subnet of its own, so the check stack can run next to the live stack.
networks:
  backend:
    ipam: !override
      config:
        - subnet: 10.46.60.8/29
