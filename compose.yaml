name: grid-load-forecast

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-python: &python
  <<: *hardening
  image: grid-load-forecast-python:local
  environment: &python-env
    GRIDLOAD_INCLUDE_PRICES: ${GRIDLOAD_INCLUDE_PRICES:-true}
    # Fixed thread pools instead of one or more threads per host core.
    POLARS_MAX_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    OMP_NUM_THREADS: "2"
  tmpfs:
    - /tmp:size=64m,noexec,nosuid

services:
  pipeline:
    <<: *python
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    # First run at start-up (a full backfill on an empty volume), then hourly. Every
    # run is stopped after 3 hours (the first backfill took 75 minutes), so a source
    # that answers too slowly cannot hold the pipeline: supercronic starts no run
    # while the previous one is active. A stopped run keeps the chunks it loaded,
    # and the next run marks it aborted and continues.
    command: ["sh", "-c", "timeout -k 1m 3h gridload run; exec supercronic /app/crontab"]
    volumes:
      - gridload-data:/data
    mem_limit: 2g
    memswap_limit: 2g
    # The 365-day backtest peaked at 3.1 cores.
    cpus: 4
    healthcheck:
      # Healthy while a run reports progress, or if the last ok or partial run is under
      # 26 h old and the newest load value under 12 h old.
      test: ["CMD", "gridload", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  api:
    <<: *python
    pull_policy: never  # image is built by the pipeline service
    # The client address of a request is taken from X-Forwarded-For only when the
    # connection comes from the web container (FORWARDED_ALLOW_IPS), so the per-client
    # limit counts the address Caddy saw, and no other peer can choose its own.
    command: ["uvicorn", "gridload.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header", "--limit-concurrency", "256", "--proxy-headers"]
    environment:
      <<: *python-env
      FORWARDED_ALLOW_IPS: 10.46.60.2
    # Only on the internal network: reachable from the web container, no egress.
    networks:
      backend:
        ipv4_address: 10.46.60.3
    depends_on:
      pipeline:
        condition: service_started
    volumes:
      - gridload-data:/data:ro
    mem_limit: 512m
    memswap_limit: 512m
    # make loadtest peaked at 2.4 cores.
    cpus: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: grid-load-forecast-web:local
    # Caddy listens on 8080, so it runs without root and without capabilities.
    user: "10002:10002"
    ports:
      - "127.0.0.1:8460:8080"
    # default carries the published port; backend reaches the API at a fixed address,
    # the only one the API trusts for X-Forwarded-For.
    networks:
      default: {}
      backend:
        ipv4_address: 10.46.60.2
    depends_on:
      api:
        condition: service_healthy
    # Every open connection holds a file descriptor, so Caddy accepts at most
    # about 4,000 at a time; further ones wait in the kernel's backlog. Each costs
    # Caddy about 16 KB while open, and the memory limit leaves room for that next
    # to the compression of large responses.
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    mem_limit: 256m
    memswap_limit: 256m
    # make loadtest peaked at 1.7 cores.
    cpus: 2
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /config:size=4m,uid=10002,gid=10002
      - /data:size=4m,uid=10002,gid=10002
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # The pipeline and the web container use the default network, which has egress:
  # the pipeline needs it for SMARD. The API shares only this internal network with
  # the web container and has no route out. Both addresses are fixed, so the web
  # address the API trusts cannot be taken by another container.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 10.46.60.0/29

volumes:
  gridload-data:
