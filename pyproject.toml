[project]
name = "grid-load-forecast"
version = "0.0.0"
description = "Day-ahead forecast of German grid load from public SMARD data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA-LICENSE.md"]
authors = [{ name = "Dennis Kasper" }]
requires-python = ">=3.14"
dependencies = [
    "duckdb",
    "fastapi",
    "holidays",
    "tzdata",
    "httpx2>=2.16.2,<3",
    "lightgbm",
    "polars",
    "pyarrow",
    "pydantic",
    "pytz",
    "uvicorn",
]

[project.scripts]
gridload = "gridload.cli:main"

[dependency-groups]
dev = [
    "hypothesis",
    "mkdocs-material",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gridload"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "DTZ", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Tests compare local wall-clock times, which are naive by design.
"tests/**" = ["S101", "PLR2004", "DTZ001"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
timeout = 60
filterwarnings = ["error"]

[tool.coverage.run]
source = ["gridload"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
