site_name: grid-load-forecast
site_description: Day-ahead forecast of German grid load from public SMARD data
repo_url: https://github.com/deka641/grid-load-forecast
strict: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
validation:
  markdown_extensions:
  - tables
  - admonition
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Tutorials:
      - Run the stack locally: tutorials/run-locally.md
  - How-to guides:
      - Operate the pipeline: how-to/operate.md
      - Develop and verify changes: how-to/develop.md
  - Reference:
      - Data model: reference/data-model.md
      - HTTP API: reference/api.md
      - Configuration: reference/configuration.md
      - Command line: reference/cli.md
      - Backtest report: reference/backtest.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Forecast and backtest method: explanation/forecast.md
      - Data source: explanation/data-source.md
