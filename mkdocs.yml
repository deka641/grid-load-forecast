site_name: grid-load-forecast
site_description: Day-ahead forecast of German grid load from public SMARD data
repo_url: https://github.com/deka641/grid-load-forecast
strict: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
  - How-to guides:
      - how-to/index.md
  - Reference:
      - reference/index.md
  - Explanation:
      - explanation/index.md
